name: Promote SDK Release

# Coordinated release of every DMZAgent SDK at a single spec version.
#
# Trigger: push a `v<version>` tag to this repo (matching VERSION).
# Sequence:
#   1. Verify each SDK repo has a release branch tagged at the same version.
#   2. Verify each SDK repo's spec-conformance check is green at the tag.
#   3. Dispatch publish.yml to each SDK repo in parallel.
#   4. Poll each registry for the artifact.
#   5. Mark the spec release promoted, or yank on partial failure.
#
# Required secrets:
#   - GH_DISPATCH_TOKEN: a fine-grained PAT with `repo:write` on all four
#     SDK repos. Repository_dispatch is the cross-repo trigger mechanism.

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      spec_version:
        description: 'Spec version to promote (e.g. 0.5.0). Must match VERSION.'
        required: true
        type: string

permissions:
  contents: read

env:
  SDK_REPOS: |
    dmzagent/dmzagent-sdk-python
    dmzagent/dmzagent-sdk-typescript
    dmzagent/dmzagent-sdk-csharp
    dmzagent/dmzagent-sdk-java

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [ -n "${{ inputs.spec_version }}" ]; then
            VERSION="${{ inputs.spec_version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          FILE_VERSION="$(cat VERSION | tr -d '[:space:]')"
          if [ "$VERSION" != "$FILE_VERSION" ]; then
            echo "::error::tag $VERSION does not match VERSION file $FILE_VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  verify-conformance:
    needs: resolve-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk:
          - dmzagent-sdk-python
          - dmzagent-sdk-typescript
          - dmzagent-sdk-csharp
          - dmzagent-sdk-java
    steps:
      - name: Verify release branch exists in ${{ matrix.sdk }}
        env:
          GH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          gh api -X GET \
            "/repos/dmzagent/${{ matrix.sdk }}/branches/release%2Fv${VERSION}" \
            > /dev/null

      - name: Verify spec-conformance status check is green
        env:
          GH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          SHA=$(gh api "/repos/dmzagent/${{ matrix.sdk }}/branches/release%2Fv${VERSION}" \
                 --jq '.commit.sha')
          # The SDKs publish this as a COMMIT STATUS (createCommitStatus,
          # context spec-conformance/<version>), not a check run. This
          # queried /check-runs and filtered .check_runs[].name, which a
          # commit status never appears in — so STATE was always empty and
          # the gate could never pass. It failed closed, which is the safe
          # direction, but it meant coordinated release never worked.
          STATE=$(gh api "/repos/dmzagent/${{ matrix.sdk }}/commits/${SHA}/status" \
                  --jq ".statuses[] | select(.context == \"spec-conformance/${VERSION}\") | .state" \
                  | head -n1)
          if [ "$STATE" != "success" ]; then
            echo "::error::spec-conformance/${VERSION} not green for ${{ matrix.sdk }} — got: ${STATE:-<no such status on ${SHA}>}"
            exit 1
          fi

  dispatch-publish:
    needs: [resolve-version, verify-conformance]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk:
          - dmzagent-sdk-python
          - dmzagent-sdk-typescript
          - dmzagent-sdk-csharp
          - dmzagent-sdk-java
    steps:
      - name: Dispatch publish to ${{ matrix.sdk }}
        env:
          GH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          gh api -X POST \
            "/repos/dmzagent/${{ matrix.sdk }}/dispatches" \
            -f event_type=publish \
            -F client_payload[version]="${VERSION}"

  verify-registries:
    needs: [resolve-version, dispatch-publish]
    runs-on: ubuntu-latest
    steps:
      - name: Wait + poll registries
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          # Give publishers a head start. Registry CDNs (especially PyPI
          # and Maven Central) can take minutes to index.
          sleep 60
          DEADLINE=$(( $(date +%s) + 1800 ))
          POLLED_PYPI=0; POLLED_NPM=0; POLLED_NUGET=0; POLLED_MAVEN=0
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            if [ "$POLLED_PYPI" -eq 0 ] && curl -sf -o /dev/null \
              "https://pypi.org/pypi/dmzagent/${VERSION}/json"; then
              echo "pypi: confirmed"; POLLED_PYPI=1
            fi
            if [ "$POLLED_NPM" -eq 0 ] && curl -sf -o /dev/null \
              "https://registry.npmjs.org/@dmzagent/sdk/${VERSION}"; then
              echo "npm: confirmed"; POLLED_NPM=1
            fi
            if [ "$POLLED_NUGET" -eq 0 ] && curl -sf -o /dev/null \
              "https://api.nuget.org/v3-flatcontainer/dmzagent.sdk/${VERSION}/dmzagent.sdk.${VERSION}.nupkg"; then
              echo "nuget: confirmed"; POLLED_NUGET=1
            fi
            if [ "$POLLED_MAVEN" -eq 0 ] && curl -sf -o /dev/null \
              "https://repo1.maven.org/maven2/dev/dmzagent/dmzagent-sdk/${VERSION}/dmzagent-sdk-${VERSION}.pom"; then
              echo "maven: confirmed"; POLLED_MAVEN=1
            fi
            if [ "$POLLED_PYPI" -eq 1 ] && [ "$POLLED_NPM" -eq 1 ] \
               && [ "$POLLED_NUGET" -eq 1 ] && [ "$POLLED_MAVEN" -eq 1 ]; then
              echo "all four registries confirmed"
              exit 0
            fi
            sleep 30
          done
          echo "::error::deadline expired before all registries confirmed"
          echo "::error::pypi=$POLLED_PYPI npm=$POLLED_NPM nuget=$POLLED_NUGET maven=$POLLED_MAVEN"
          exit 1

  promote:
    needs: [resolve-version, verify-registries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mark release promoted
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          gh release edit "v${VERSION}" \
            --notes-file CHANGELOG.md \
            --latest \
            --prerelease=false

  yank-on-failure:
    # Only when a publish was actually ATTEMPTED. This was a bare
    # `if: failure()`, so it fired on any failed run — including one where
    # verify-conformance stopped the release and dispatch-publish never ran.
    # The v0.8.0 tag proved it: nothing was published, and this job still
    # tried to raise "partial publish — manual cleanup required", telling a
    # maintainer to go yank packages from four registries that had never
    # received them. A false yank alarm is worse than no alarm, because it
    # arrives exactly when someone is under pressure and inclined to act.
    #
    # dispatch-publish is 'skipped' when the gate held and 'failure' when it
    # dispatched some repos but not all — the latter IS a yank case, so the
    # test is against 'skipped' rather than for 'success'.
    needs: [resolve-version, dispatch-publish, verify-registries]
    if: failure() && needs.dispatch-publish.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The workflow-level default is contents:read only, so creating the
      # issue needs this explicitly. Scoped to the job, not the workflow.
      issues: write
    steps:
      - name: Open issue for coordinated yank
        env:
          # GH_DISPATCH_TOKEN is a PAT needed for CROSS-repo dispatch. This
          # issue is filed in THIS repo, so the job token is sufficient and
          # the alert no longer disappears when the PAT is unset — which is
          # how it failed on the v0.8.0 tag (GH_TOKEN empty, gh exit 4).
          GH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN || github.token }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          # Written to a file rather than passed inline: the previous --body
          # was a double-quoted bash string containing \n, which bash does not
          # expand and gh does not interpret, so the issue would have rendered
          # as one line with literal backslash-n throughout.
          cat > /tmp/yank-body.md <<EOF
          Promotion of spec v${VERSION} failed **after** publish was dispatched.
          Some registries may have accepted the publish; others did not.

          Verify each, then yank or deprecate whatever landed:

          - **PyPI** — \`pip yank dmzagent==${VERSION}\` (maintainer account)
          - **npm** — \`npm deprecate @dmzagent/sdk@${VERSION} 'yanked: partial publish'\`
          - **NuGet** — unlist via the portal; NuGet has no delete after retention
          - **Maven Central** — file a ticket, yanks are manual

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          gh issue create \
            --repo dmzagent/dmzagent-sdk-spec \
            --title "[yank] v${VERSION} partial publish — manual cleanup required" \
            --body-file /tmp/yank-body.md
